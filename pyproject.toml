[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpu_waterz"
version = "0.1.0"
description = "CUDA affinity-to-labels: watershed + contact-mean agglomeration (waterz-compatible)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "peti12352" }]
dependencies = [
  "numpy>=1.22",
]

[project.optional-dependencies]
torch = ["torch"]
zarr = ["zarr"]

[project.urls]
Repository = "https://github.com/peti12352/gpu-waterz"
Documentation = "https://github.com/peti12352/gpu-waterz#readme"

[dependency-groups]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["gpu_waterz"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
